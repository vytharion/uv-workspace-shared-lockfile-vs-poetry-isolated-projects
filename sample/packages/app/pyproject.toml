[project]
name = "app"
version = "0.1.0"
description = "Downstream service that imports the shared library."
requires-python = ">=3.11"
dependencies = [
    "shared-lib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
