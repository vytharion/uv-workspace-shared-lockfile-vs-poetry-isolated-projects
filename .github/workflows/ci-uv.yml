name: ci-uv

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      # One cache key for the whole workspace. The lockfile at
      # sample/uv.lock covers every workspace member, so a single
      # cache hit primes every package under packages/*.
      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('sample/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: uv sync (workspace)
        run: uv sync --all-packages --frozen

      - name: Run tests
        run: uv run pytest tests/ -q
